# Save this file in your repo as: .github/workflows/update-games.yml
# It downloads the GameMonetize feed on GitHub's servers (so the browser never needs
# to bypass CORS) and saves it as games.json next to index.html. Runs daily, or by hand
# from the Actions tab (Run workflow).
name: Update games
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch feed
        run: |
          python3 - <<'PY'
          import json, urllib.request
          seen, out = set(), []
          for p in range(1, 11):
              url = f"https://gamemonetize.com/feed.php?format=0&num=100&page={p}"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  data = json.load(urllib.request.urlopen(req, timeout=30))
              except Exception as e:
                  print("page", p, "failed:", e)
                  break
              if not isinstance(data, list) or not data:
                  break
              added = 0
              for g in data:
                  u = g.get("url")
                  if u and u not in seen:
                      seen.add(u)
                      out.append(g)
                      added += 1
              print("page", p, "->", added, "new games")
              if added == 0:
                  break
          if not out:
              raise SystemExit("No games fetched. Check the feed URL.")
          with open("games.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False)
          print("Saved", len(out), "games")
          PY
      - name: Commit games.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add games.json
          git diff --cached --quiet || git commit -m "Update games.json"
          git push
